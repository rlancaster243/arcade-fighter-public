name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_DIR: FightCore
  XCODE_PROJECT: ArcadeFighter.xcodeproj
  XCODE_SCHEME: ArcadeFighter
  APP_NAME: ArcadeFighter.app
  ENTITLEMENTS: App/ArcadeFighter.entitlements
  MAX_APP_BYTES: "15000000"

jobs:
  core-linux:
    name: FightCore tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.1.3-noble@sha256:42b58c8cff07f45e6f083ade65743b5b147d0c01d4370d602fcf3c7b37dc1cac
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: swift test (FightCore)
        working-directory: ${{ env.CORE_DIR }}
        run: swift test --parallel

  app-macos:
    name: App build (macOS)
    needs: core-linux
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          swift --version

      - name: swift test (FightCore on macOS)
        working-directory: ${{ env.CORE_DIR }}
        run: swift test --parallel

      - name: Build app (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="build/DerivedData/Build/Products/Release/$APP_NAME"
          test -d "$APP_PATH" || { echo "::error::$APP_PATH not found"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Check declared entitlements (sandbox on, no network)
        run: |
          set -euo pipefail
          declared=$(xcodebuild -showBuildSettings \
              -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release 2>/dev/null \
            | awk -F' = ' '/^ *CODE_SIGN_ENTITLEMENTS = /{print $2; exit}')
          if [ "$declared" != "$ENTITLEMENTS" ]; then
            echo "::error::CODE_SIGN_ENTITLEMENTS is '$declared', expected '$ENTITLEMENTS'"
            exit 1
          fi
          sandbox=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS" 2>/dev/null || true)
          if [ "$sandbox" != "true" ]; then
            echo "::error::App Sandbox is not enabled in $ENTITLEMENTS"
            exit 1
          fi
          status=0
          while IFS= read -r -d '' f; do
            for key in com.apple.security.network.client com.apple.security.network.server; do
              if /usr/libexec/PlistBuddy -c "Print :$key" "$f" >/dev/null 2>&1; then
                echo "::error file=$f::$key is present; the app must be offline"
                status=1
              fi
            done
          done < <(find . -name '*.entitlements' -not -path './build/*' -print0)
          exit $status

      - name: Ad-hoc sign with entitlements (no certificate, no secrets)
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --entitlements "$ENTITLEMENTS" "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Check embedded entitlements (no network)
        run: |
          set -euo pipefail
          codesign -d --entitlements - --xml "$APP_PATH" > embedded.plist 2>/dev/null
          for key in com.apple.security.network.client com.apple.security.network.server; do
            if /usr/libexec/PlistBuddy -c "Print :$key" embedded.plist >/dev/null 2>&1; then
              echo "::error::$key is embedded in the signed app; the app must be offline"
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' embedded.plist | grep -qx true \
            || { echo "::error::App Sandbox not embedded in the signed app"; exit 1; }

      - name: Check size (< 15,000,000 bytes)
        run: |
          set -euo pipefail
          bytes=$(find "$APP_PATH" -type f -print0 | xargs -0 stat -f%z | awk '{s+=$1} END {print s+0}')
          echo "App bundle size: $bytes bytes (limit: < $MAX_APP_BYTES)"
          echo "App bundle size: $bytes bytes (limit: < $MAX_APP_BYTES)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -ge "$MAX_APP_BYTES" ]; then
            echo "::error::App bundle is $bytes bytes; must be under $MAX_APP_BYTES"
            exit 1
          fi

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "ArcadeFighter-${{ github.sha }}.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ArcadeFighter-${{ github.sha }}
          path: ArcadeFighter-${{ github.sha }}.zip
          retention-days: 3
          if-no-files-found: error
